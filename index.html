<title>Calamar 26/27</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg0:#08140f; --bg1:#0c2019; --bg2:#06120d;
  --card:#102019; --card-2:#15281f; --cream:#0e1c15;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#eaf6ef; --ink-soft:#8aa399; --ink-dim:#5d756b;
  --pink:#ff1f7a; --pink-deep:#d31361; --pink-soft:rgba(255,31,122,.14);
  --teal:#19c7a6; --teal-deep:#0e9079; --teal-soft:rgba(25,199,166,.14);
  --amber:#ffb020; --amber-soft:rgba(255,176,32,.14);
  --chip-off:#16271f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.35);
  --display: "Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",Impact,Haettenschweiler,sans-serif;
  --body: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body);
  color:var(--ink);
  background:
    radial-gradient(900px 520px at 50% -8%, rgba(25,199,166,.16) 0%, rgba(25,199,166,0) 60%),
    radial-gradient(700px 420px at 100% 8%, rgba(255,31,122,.12) 0%, rgba(255,31,122,0) 55%),
    linear-gradient(180deg,var(--bg1) 0%, var(--bg0) 45%, var(--bg2) 100%);
  background-attachment:fixed;
  min-height:100vh; min-height:100dvh;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 72px;padding-top:max(24px,env(safe-area-inset-top));}
::selection{background:var(--pink);color:#fff}
a{color:var(--teal)}
button,input,select,textarea{font-family:inherit}
input,select,textarea{color:var(--ink)}

/* ---------- HEADER ---------- */
.shapes{display:flex;gap:14px;align-items:center;font-size:20px;line-height:1;color:var(--pink);
  text-shadow:0 0 16px rgba(255,31,122,.5);margin-bottom:14px}
.shapes b{font-weight:400}
.shapes .sq{color:var(--teal);text-shadow:0 0 16px rgba(25,199,166,.5)}
h1{font-family:var(--display);font-weight:800;
  color:#fff;letter-spacing:-0.01em;line-height:.9;
  font-size:clamp(38px,10.5vw,68px);margin:0 0 12px;text-transform:uppercase;text-wrap:balance}
h1 .l2{display:block;color:var(--pink);text-shadow:0 0 24px rgba(255,31,122,.35)}
.jtags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.jtag{display:inline-flex;align-items:center;gap:8px;max-width:100%;
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal);background:rgba(25,199,166,.10);
  border:1px solid rgba(25,199,166,.32);border-radius:999px;padding:6px 13px}
.jtag span:not(.dot){min-width:0}
.jtag.pink{color:var(--pink);background:rgba(255,31,122,.10);border-color:rgba(255,31,122,.32)}
.jtag .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.lede{color:#bcd3c9;font-size:15px;max-width:60ch;margin:16px 0 22px}
.lede b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;-ms-overflow-style:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  font-weight:700;font-size:13px;letter-spacing:.03em;border-radius:11px;padding:10px 16px;cursor:pointer}
.tabbtn:hover{border-color:var(--line-2);color:var(--ink)}
.tabbtn.active{background:linear-gradient(160deg,var(--card-2),var(--card));color:#fff;border-color:var(--pink)}
.tabbtn:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.panel{display:none;animation:rise .22s ease both}
.panel.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- generic card / grid ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.section-h{display:flex;align-items:center;gap:10px;margin:26px 2px 10px}
.section-h:first-child{margin-top:0}
.section-h .mk{color:var(--pink);font-size:15px;line-height:1;text-shadow:0 0 10px rgba(255,31,122,.4)}
.section-h .tag{font-family:var(--display);font-weight:800;color:#fff;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.section-h .line{flex:1;height:1px;background:var(--line)}
.section-h .side{font-size:12px;color:var(--ink-soft)}

.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.stats4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
.stat .n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--teal);font-variant-numeric:tabular-nums}
.stat .n.pink{color:var(--pink)}
.stat .n.amber{color:var(--amber)}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);
  background:rgba(255,255,255,.05);color:var(--ink);border-radius:11px;
  padding:10px 16px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.10)}
.btn:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.btn.primary{background:linear-gradient(145deg,var(--teal),var(--teal-deep));color:#06120d;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:rgba(255,31,122,.12);border-color:rgba(255,31,122,.4);color:#ffd7e6}
.btn.danger:hover{background:rgba(255,31,122,.2)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill-ok{color:var(--teal);background:var(--teal-soft);border:1px solid rgba(25,199,166,.35)}
.pill-danger{color:#ffd7e6;background:var(--pink-soft);border:1px solid rgba(255,31,122,.4)}
.pill-warn{color:var(--amber);background:var(--amber-soft);border:1px solid rgba(255,176,32,.4)}
.pill-off{color:var(--ink-soft);background:var(--chip-off);border:1px solid var(--line)}

/* ---------- search / inputs ---------- */
.search{position:relative;margin:0 0 16px}
.search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 15px 14px 42px;
  font-size:15px;color:var(--ink);background:var(--card);box-shadow:var(--shadow);outline:none}
.search input::placeholder{color:var(--ink-dim)}
.search input:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft),var(--shadow)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-dim)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  background:var(--cream);font-size:14px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink)}
.field textarea{resize:vertical;min-height:90px;font-family:var(--body);line-height:1.5}
.formgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.formgrid.cols2{grid-template-columns:1fr 1fr}.formgrid.cols3{grid-template-columns:1fr 1fr 1fr}}

/* ---------- jugadores grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.pcard{display:flex;align-items:center;gap:11px;text-align:left;min-width:0;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 13px;cursor:pointer;font-family:inherit;color:var(--ink);width:100%;
  box-shadow:var(--shadow);transition:transform .12s ease, border-color .12s ease}
.pcard:hover{transform:translateY(-2px);border-color:var(--pink)}
.pcard:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.num{position:relative;flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;overflow:hidden;
  font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.02em;color:#06120d;
  background:linear-gradient(145deg,var(--teal),var(--teal-deep));box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.pcard.st-eliminado .num,.pcard.st-expulsado .num{background:linear-gradient(145deg,#4a5b53,#33413b);color:#cfe0d8}
.num .avatar-ico{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);width:82%;height:82%;color:currentColor;opacity:.28;pointer-events:none}
.num .ini{position:relative;z-index:1;text-shadow:0 1px 1px rgba(255,255,255,.25)}
.pname{display:block;font-weight:700;font-size:14.5px;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.empty{color:#bcd3c9;text-align:center;padding:30px 0}

/* ---------- detalle jugador ---------- */
.back{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);
  background:rgba(255,255,255,.05);color:var(--ink);border-radius:999px;
  padding:9px 15px 9px 12px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:16px}
.back:hover{background:rgba(255,255,255,.10)}
.hero{background:linear-gradient(160deg,var(--card-2),var(--card));border-radius:20px;padding:22px;
  box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden;margin-bottom:16px}
.hero::after{content:"○ △ □";position:absolute;right:-6px;top:-10px;font-size:60px;line-height:1;
  color:rgba(255,31,122,.10);letter-spacing:10px;pointer-events:none}
.hero-top{display:flex;align-items:center;gap:15px;position:relative;z-index:1;flex-wrap:wrap}
.num-lg{width:60px;height:60px;border-radius:16px;font-size:21px}
.hero h2{font-family:var(--display);font-weight:800;text-transform:uppercase;color:#fff;
  font-size:clamp(22px,6vw,32px);line-height:1;margin:0 0 6px;letter-spacing:-.01em}
.exrow{display:flex;flex-wrap:wrap;gap:7px}
.extag{display:inline-flex;align-items:center;gap:7px;background:rgba(25,199,166,.12);
  border:1px solid rgba(25,199,166,.32);color:#fff;border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:600}
.trow{display:flex;align-items:center;gap:10px;background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:13px}
.trow .tlabel{flex:1;min-width:0;color:var(--ink-soft)}
.trow .tteam{font-weight:700;color:#fff}

/* ---------- jornada / match cards ---------- */
.jcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.jcard-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.jcard-head .t{font-family:var(--display);font-weight:800;font-size:16px;color:#fff;letter-spacing:.02em;text-transform:uppercase}
.jcard-head .sub{font-size:12px;color:var(--ink-soft);flex:1}
.jcard-head svg{transition:transform .16s ease;color:var(--ink-dim);flex:0 0 auto}
.jcard.open .jcard-head svg{transform:rotate(180deg)}
.jcard-body{display:none;padding:0 16px 16px}
.jcard.open .jcard-body{display:block}

.picktable{width:100%;border-collapse:collapse;font-size:13px}
.picktable th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);
  padding:8px 8px;border-bottom:1px solid var(--line)}
.picktable td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.picktable tr:last-child td{border-bottom:none}
.picktable select,.picktable input{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;color:var(--ink)}
.tblwrap{overflow-x:auto;margin:10px 0}
.warnchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);
  border:1px solid rgba(255,176,32,.4);border-radius:8px;padding:2px 7px;margin-left:4px}

.pastebox{margin:10px 0}
.previewrow{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.previewrow.roster{grid-template-columns:1.6fr auto auto}
.previewrow input[type="text"]{border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;background:#fff;color:#111;font-size:13.5px}
.previewrow input[type="text"]:focus{outline:2px solid var(--pink);outline-offset:1px}
.previewrow select{border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;background:#fff;color:#111;font-size:13.5px}
.previewrow select:focus{outline:2px solid var(--pink);outline-offset:1px}
.previewrow select.unresolved{border-color:var(--amber);background:#fff7e8;color:#7a4a00;font-weight:700}
@media(max-width:640px){.previewrow{grid-template-columns:1fr;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
  .previewrow.roster{grid-template-columns:1fr}}

.matchrow{display:flex;align-items:center;gap:10px;background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.matchrow .mteam{flex:1;min-width:0;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.matchrow .mteam.right{text-align:right}
.matchrow .mextra{flex:0 0 auto;font-family:var(--display);font-weight:800;font-size:12.5px;color:var(--teal);
  background:rgba(25,199,166,.12);border:1px solid rgba(25,199,166,.3);border-radius:8px;padding:5px 10px;min-width:52px;text-align:center}
.picktable tr.zone-top td:first-child{border-left:3px solid var(--teal)}
.picktable tr.zone-bottom td:first-child{border-left:3px solid var(--pink)}

.gridtable{border-collapse:separate;border-spacing:0}
.gridtable th{white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:2}
.gridtable .gname{position:sticky;left:0;z-index:3;background:var(--card);text-align:left;font-weight:700;color:#fff;white-space:nowrap;padding-right:14px}
.gridtable thead th.gname{z-index:4}
.gridtable .gcell{text-align:center;white-space:nowrap;font-size:12px;font-weight:600;padding:8px 10px}
.gridtable .gcell.off{color:var(--ink-dim);font-weight:400}
.gridtable .gcell.g-ok{background:rgba(25,199,166,.14);color:#fff}
.gridtable .gcell.g-elim{background:rgba(255,31,122,.16);color:#ffd7e6}
.gridtable .gcell.g-warn{background:rgba(255,176,32,.14);color:var(--amber)}
.gridtable .gcell.g-pending{background:var(--cream);color:var(--ink-soft);font-weight:400}

footer{color:var(--ink-dim);font-size:12px;text-align:center;margin-top:36px;line-height:1.7}
footer b{color:#bcd3c9}
.hidden{display:none !important}
.muted{color:var(--ink-soft)}

#syncBanner:empty{display:none}
.syncpill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;border-radius:999px;
  padding:7px 14px;margin-bottom:16px}
.syncpill.ok{color:var(--teal);background:var(--teal-soft);border:1px solid rgba(25,199,166,.35)}
.syncpill.read{color:var(--amber);background:var(--amber-soft);border:1px solid rgba(255,176,32,.4)}
.syncpill.err{color:#ffd7e6;background:var(--pink-soft);border:1px solid rgba(255,31,122,.4)}
.syncpill a{color:inherit;text-decoration:underline;font-weight:800}

#adminPanel{max-width:460px;margin:14px auto 0;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px;box-shadow:var(--shadow)}
#adminPanel p{margin:0 0 10px;line-height:1.6}
#adminPanel .field{margin-bottom:10px}
.rules{font-size:14.5px;line-height:1.75;color:#dcebe3}
.rules h3{font-family:var(--display);font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.02em;font-size:16px;margin:22px 0 8px}
.rules h3:first-child{margin-top:0}
.rules p{margin:0 0 10px}
.rules b{color:#fff}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

<script>
"use strict";

/* ============================== ESTADO ============================== */
const STORE_KEY = "calamar2627_v1";
const RESULT_LABEL = {gano:"Ganó", no_gano:"No ganó", anulado:"Anulado/aplazado"};

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

function defaultState(){
  return {
    participants: [],   // {id, name}
    editions: [],        // Edition[]
    liga: {
      resultados: null,   // {label, updatedAt, matches:[{team1,team2,extra,raw}]}
      proximas: [],        // [{id, label, updatedAt, matches:[...]}]
      proximasUpdatedAt: 0,
      clasificacion: null, // {updatedAt, rows:[{pos,name,pj,g,e,p,gf,gc,dg,pts}]}
      autoUpdatedAt: 0     // timestamp del último data/liga.json aplicado automáticamente
    }
  };
}
function newEdition(number, season, potCarriedOver){
  return {
    id: uid(), number, season, potCarriedOver: potCarriedOver||0,
    status: "abierta",        // abierta | cerrada_ganador | cerrada_sin_ganador
    winnerId: null,
    participants: [],          // {participantId, pagado, cuota, note}
    jornadas: []                // Jornada[]
  };
}
function newJornada(label, season){
  return { id: uid(), label, season, deadline:"", picks: [], expelled: [] };
  // picks: {participantId, team1, team2, result1, result2}
  // expelled: [participantId] marcados como "no pronosticó"
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(!data.liga) data.liga = {resultados:null, proximas:[], clasificacion:null};
      if(data.liga.proximasUpdatedAt==null) data.liga.proximasUpdatedAt = 0;
      if(data.liga.autoUpdatedAt==null) data.liga.autoUpdatedAt = 0;
      return data;
    }
  }catch(e){}
  return defaultState();
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  schedulePublish();
}

/* ============================== FEED AUTOMÁTICO DE LIGA (data/liga.json) ============================== */
function mergeLigaSeed(seed){
  if(!seed) return;
  if(seed.resultados && (!state.liga.resultados || (seed.resultados.updatedAt||0) > (state.liga.resultados.updatedAt||0))){
    state.liga.resultados = seed.resultados;
  }
  if(Array.isArray(seed.proximas) && (seed.generatedAt||0) > (state.liga.proximasUpdatedAt||0)){
    state.liga.proximas = seed.proximas;
    state.liga.proximasUpdatedAt = seed.generatedAt||Date.now();
  }
  if(seed.clasificacion && (!state.liga.clasificacion || (seed.clasificacion.updatedAt||0) > (state.liga.clasificacion.updatedAt||0))){
    state.liga.clasificacion = seed.clasificacion;
  }
  state.liga.autoUpdatedAt = seed.generatedAt||Date.now();
  saveState();
}
function loadLigaFeed(){
  fetch("./data/liga.json", {cache:"no-store"})
    .then(r=> r.ok ? r.json() : null)
    .then(seed=>{ if(seed){ mergeLigaSeed(seed); render(); } })
    .catch(()=>{ /* sin red o primer despliegue: se queda con los datos que ya hubiera */ });
}

/* ============================== ESTADO COMPARTIDO (data/game.json) ============================== */
const GH_OWNER = "acetra";
const GH_REPO = "calamar-26-27";
const GH_TOKEN_KEY = "calamar_admin_token";
const GAME_PATH = "data/game.json";

let githubToken = localStorage.getItem(GH_TOKEN_KEY) || "";
let syncStatus = { state: "loading", message: "" }; // loading | synced | read | publishing | error
let publishTimer = null;
/* updatedAt del último data/game.json que sabemos que es el más reciente (propio o remoto).
   null = todavía no hemos cargado nada, así que no comprobamos conflictos. Sirve para detectar
   si alguien más ha publicado cambios desde que cargamos esta página, y así no sobrescribirlos
   a ciegas con una copia local desactualizada (ver publishGame). */
let lastRemoteUpdatedAt = null;
/* Evita que dos publishGame() se ejecuten a la vez (p.ej. si el admin edita varias cosas seguidas
   y una publicación anterior todavía está en curso cuando salta la siguiente). Si eso pasara, las
   dos harían GET+PUT casi a la vez con el mismo sha de partida y una de las dos sería rechazada por
   GitHub (409) de forma confusa aunque no se hubiera perdido ningún dato realmente. En vez de eso,
   encolamos una única republicación para justo después de que termine la que está en curso. */
let isPublishing = false;
let publishAgainNeeded = false;

function b64EncodeUtf8(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) => String.fromCharCode(parseInt(p1, 16))));
}
function b64DecodeUtf8(b64){
  const bin = atob(String(b64||"").replace(/\n/g,""));
  return decodeURIComponent(Array.prototype.map.call(bin, c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
}
function safeParseGameJson(b64content){
  try{ return JSON.parse(b64DecodeUtf8(b64content)); }catch(e){ return null; }
}

function loadGameFeed(){
  fetch("./data/game.json", {cache:"no-store"})
    .then(r=> r.ok ? r.json() : null)
    .then(remote=>{
      if(remote && Array.isArray(remote.participants) && Array.isArray(remote.editions)){
        state.participants = remote.participants;
        state.editions = remote.editions;
        lastRemoteUpdatedAt = remote.updatedAt || 0;
        saveLocalOnly();
        syncStatus = { state: githubToken? "synced" : "read", message: fmtDate(remote.updatedAt) };
      } else {
        syncStatus = { state: githubToken? "synced" : "read", message: "" };
      }
      activePlayerId = null;
      render();
    })
    .catch(()=>{
      syncStatus = { state: "error", message: "Sin conexión con GitHub: viendo la última copia guardada en este navegador." };
      render();
    });
}

/* guarda en localStorage sin disparar una publicación (usado al recibir datos remotos) */
function saveLocalOnly(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function schedulePublish(){
  if(!githubToken) return;
  clearTimeout(publishTimer);
  publishTimer = setTimeout(publishGame, 1200);
}

const CONFLICT_MESSAGE = "Hay cambios más recientes publicados desde otro dispositivo o pestaña. Para no perderlos, tu último cambio no se ha publicado: recarga la página para ver la versión más reciente antes de seguir editando.";

/* Nota sobre data/liga.json: lo actualiza el workflow automático de GitHub Actions con sus propios
   commits, en paralelo a estas publicaciones de data/game.json desde el navegador. Esto NO puede
   causar conflictos ni pérdida de datos entre sí: la API de contenidos de GitHub comprueba y
   bloquea únicamente por el sha del archivo que se está escribiendo (aquí, game.json), no por el
   estado de todo el repositorio. Un commit que solo toca liga.json no cambia el sha de game.json,
   así que nunca hace fallar ni pisa una publicación de game.json (y viceversa). */
async function publishGame(){
  if(!githubToken) return;
  if(isPublishing){
    /* Ya hay una publicación en curso: no lancemos una segunda en paralelo (eso podría chocar
       con la primera). En cuanto termine, se vuelve a publicar automáticamente con los datos
       más recientes (incluido cualquier cambio hecho mientras tanto). */
    publishAgainNeeded = true;
    return;
  }
  isPublishing = true;
  syncStatus = { state: "publishing", message: "" };
  renderSyncBanner();
  try{
    const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GAME_PATH}`;
    const headers = { "Authorization": `Bearer ${githubToken}`, "Accept": "application/vnd.github+json" };
    let sha = undefined;
    const getRes = await fetch(apiUrl, { headers });
    if(getRes.status === 200){
      const current = await getRes.json();
      sha = current.sha;
      const remoteNow = safeParseGameJson(current.content);
      if(remoteNow && lastRemoteUpdatedAt!=null && (remoteNow.updatedAt||0) > lastRemoteUpdatedAt){
        /* Alguien ha publicado una versión más nueva que la que teníamos cargada (otra pestaña,
           otro dispositivo). Si publicáramos ahora mismo, sobrescribiríamos esos cambios con
           nuestra copia desactualizada. Mejor parar y avisar que perder datos en silencio. */
        syncStatus = { state:"error", message: CONFLICT_MESSAGE };
        return;
      }
    } else if(getRes.status !== 404){
      throw new Error(`No se pudo leer el archivo actual (HTTP ${getRes.status})`);
    }
    const payload = { participants: state.participants, editions: state.editions, updatedAt: Date.now() };
    const putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: { ...headers, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: "Actualizar datos del juego",
        content: b64EncodeUtf8(JSON.stringify(payload, null, 2)),
        sha,
        branch: "main",
      }),
    });
    if(!putRes.ok){
      if(putRes.status === 409){
        /* 409 = el sha que mandamos ya no es el actual: alguien ha publicado justo entre nuestro
           GET y este PUT (dos administradores editando casi a la vez). GitHub ha protegido los
           datos rechazando nuestra escritura, así que no se ha perdido nada; solo hace falta
           avisar y que se recargue para partir de la versión más reciente. */
        syncStatus = { state:"error", message: CONFLICT_MESSAGE };
        return;
      }
      const body = await putRes.json().catch(()=>({}));
      throw new Error(body.message || `HTTP ${putRes.status}`);
    }
    lastRemoteUpdatedAt = payload.updatedAt;
    syncStatus = { state: "synced", message: fmtDate(payload.updatedAt) };
  } catch(e){
    syncStatus = { state: "error", message: `No se pudo publicar: ${e.message}` };
  } finally{
    isPublishing = false;
    renderSyncBanner();
    if(publishAgainNeeded){
      publishAgainNeeded = false;
      publishGame();
    }
  }
}

function renderSyncBanner(){
  const el = document.getElementById("syncBanner");
  if(!el) return;
  const s = syncStatus;
  if(s.state==="publishing"){
    el.innerHTML = `<span class="syncpill ok">⏳ Publicando cambios en GitHub…</span>`;
  } else if(s.state==="synced"){
    el.innerHTML = `<span class="syncpill ok">✓ Modo administrador · publicado${s.message?` · ${esc(s.message)}`:""}</span>`;
  } else if(s.state==="error"){
    el.innerHTML = `<span class="syncpill err">⚠ ${esc(s.message||"Error de sincronización")}</span>`;
  } else if(s.state==="read"){
    el.innerHTML = `<span class="syncpill read">👁 Modo lectura — viendo los datos compartidos${s.message?` (actualizados ${esc(s.message)})`:""}. Solo un administrador puede publicar cambios.</span>`;
  } else {
    el.innerHTML = "";
  }
}

/* ============================== HELPERS ============================== */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function initialsOf(name){
  return String(name||"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
}
function avatarHTML(name, extraClass){
  return `<span class="num${extraClass?` ${extraClass}`:""}">
    <svg class="avatar-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12.5c2.9 0 5.25-2.35 5.25-5.25S14.9 2 12 2 6.75 4.35 6.75 7.25 9.1 12.5 12 12.5Zm0 2.5c-4.14 0-9 2.02-9 5.5V22h18v-1.5c0-3.48-4.86-5.5-9-5.5Z"/></svg>
    <span class="ini">${esc(initialsOf(name))}</span>
  </span>`;
}
function normName(s){ return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function isAdmin(){ return Boolean(githubToken); }
function findParticipantByName(name){
  const n = normName(name);
  return state.participants.find(p=>normName(p.name)===n) || null;
}
function getParticipant(id){ return state.participants.find(p=>p.id===id) || null; }
function ensureParticipant(name){
  let p = findParticipantByName(name);
  if(!p){ p = {id: uid(), name: name.trim()}; state.participants.push(p); }
  return p;
}
function currentEdition(){
  if(!state.editions.length) return null;
  return state.editions.find(e=>e.status==="abierta") || state.editions[state.editions.length-1];
}
function editionIndex(ed){ return state.editions.findIndex(e=>e.id===ed.id); }

/* devuelve si el participante ya jugó alguna edición anterior a la indicada */
function isNewToChain(participantId, edIdx){
  for(let i=0;i<edIdx;i++){
    if(state.editions[i].participants.some(ep=>ep.participantId===participantId)) return false;
  }
  return true;
}
function suggestedCuota(participantId, ed){
  const idx = editionIndex(ed);
  return isNewToChain(participantId, idx) ? 10*ed.number : 10;
}

/* calcula outcome de un pick: 'sobrevive' | 'eliminado' | 'anulada' | 'pendiente' */
function pickOutcome(pick){
  if(pick.result1==="gano") return {effective:pick.team1, outcome:"sobrevive"};
  if(pick.result1==="no_gano") return {effective:pick.team1, outcome:"eliminado"};
  if(pick.result1==="anulado"){
    if(pick.result2==="gano") return {effective:pick.team2, outcome:"sobrevive"};
    if(pick.result2==="no_gano") return {effective:pick.team2, outcome:"eliminado"};
    if(pick.result2==="anulado") return {effective:null, outcome:"anulada"};
    return {effective:null, outcome:"pendiente"};
  }
  return {effective:null, outcome:"pendiente"};
}

/* deriva estado de cada participante de una edición, jornada a jornada, en orden */
function deriveEdition(ed){
  const map = {}; // participantId -> {status, eliminatedIn, cuota, pagado}
  ed.participants.forEach(ep=>{
    if(!ep.pagado){
      map[ep.participantId] = {status:"expulsado_impago", eliminatedIn:null};
    } else {
      map[ep.participantId] = {status:"activo", eliminatedIn:null};
    }
  });
  ed.jornadas.forEach(j=>{
    (j.expelled||[]).forEach(pid=>{
      if(map[pid] && map[pid].status==="activo"){
        map[pid] = {status:"expulsado_no_pronostico", eliminatedIn:j.label};
      }
    });
    j.picks.forEach(pick=>{
      const m = map[pick.participantId];
      if(!m || m.status!=="activo") return;
      const r = pickOutcome(pick);
      if(r.outcome==="eliminado"){
        map[pick.participantId] = {status:"eliminado", eliminatedIn:j.label};
      }
    });
  });
  return map;
}

/* equipos usados por un jugador, a través de TODAS las ediciones (orden cronológico) */
/* Los equipos "gastados" solo cuentan dentro de la MISMA edición (se reinician al abrir una edición nueva) */
function usedTeamsFor(ed, participantId, excludeJornadaId){
  const out = [];
  ed.jornadas.forEach(j=>{
    if(j.id===excludeJornadaId) return;
    j.picks.filter(p=>p.participantId===participantId).forEach(pick=>{
      const r = pickOutcome(pick);
      if((r.outcome==="sobrevive"||r.outcome==="eliminado") && r.effective){
        out.push({team:r.effective, jLabel:j.label, outcome:r.outcome});
      }
    });
  });
  return out;
}
function teamAlreadyUsed(ed, participantId, teamName, excludeJornadaId){
  if(!teamName) return false;
  const n = normName(teamName);
  return usedTeamsFor(ed, participantId, excludeJornadaId).some(t=>normName(t.team)===n);
}

function computeMoney(ed){
  const recaudacion = ed.participants.filter(ep=>ep.pagado).reduce((s,ep)=>s+(Number(ep.cuota)||0),0);
  const aporte = recaudacion*0.9, comision = recaudacion*0.1;
  const boteTotal = (Number(ed.potCarriedOver)||0) + aporte;
  return {recaudacion, aporte, comision, boteTotal};
}
function fmtEUR(n){
  return (Math.round((n||0)*100)/100).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
}

      box.innerHTML = `

          <textarea id="rosterPaste" placeholder="1. Sergio Acevedo ✅&#10;2. Diego Serrano&#10;..."></textarea>
        </div>
        <div class="btnrow" style="margin-top:8px"><button class="btn sm" id="parseRosterBtn">Analizar lista</button></div>
        <div id="rosterPreview"></div>`;
      document.getElementById("rosterPaste").focus();
      document.getElementById("parseRosterBtn").addEventListener("click", ()=>{
        const rows = parseRoster(document.getElementById("rosterPaste").value);
        document.getElementById("rosterPreview").innerHTML = rosterPreviewHTML(rows, ed);
        wireRosterPreview(ed);
      });
    });
  }
}

function parseRoster(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const paid = /[✅✓☑]/.test(line);
    const name = line
      .replace(/[✅✓☑]/g,"")
      .replace(/[⁠​‌‍]/g,"")
      .replace(/^[\s]*\d+[\.\):]?\s*/,"")
      .replace(/^[-•*]\s*/,"")
      .trim();
    return {name, paid};
  }).filter(r=>r.name);
}

function rosterPreviewHTML(rows, ed){
  if(!rows.length) return `<p class="muted" style="margin:8px 0 0">No se ha detectado ningún nombre en el texto.</p>`;
  return `
    <div class="section-h" style="margin:14px 2px 8px"><span class="mk">△</span><span class="tag">Revisa antes de confirmar</span><span class="line"></span></div>
    <div id="rosterRows">
      ${rows.map((r,i)=>`
        <div class="previewrow roster" data-i="${i}">
          <input type="text" value="${esc(r.name)}" data-f="name" placeholder="Nombre jugador">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)"><input type="checkbox" data-f="paid" ${r.paid?"checked":""}> Pagado</label>
          <button class="btn sm danger" data-act="dropRosterRow">Quitar</button>
        </div>`).join("")}
    </div>
    <div class="btnrow" style="margin-top:8px"><button class="btn primary sm" id="confirmRoster">Añadir ${rows.length} jugadores a la edición ${ed.number}</button></div>
  `;
}

function wireRosterPreview(ed){
  const container = document.getElementById("rosterPreview");
  if(!container) return;
  container.addEventListener("click", e=>{
    if(e.target.dataset.act==="dropRosterRow"){
      e.target.closest(".previewrow").remove();
    }
    if(e.target.id==="confirmRoster"){
      const rows = Array.from(container.querySelectorAll(".previewrow")).map(row=>({
        name: row.querySelector('[data-f="name"]').value.trim(),
        paid: row.querySelector('[data-f="paid"]').checked,
      })).filter(r=>r.name);
      rows.forEach(r=>{
        const p = ensureParticipant(r.name);
        const existing = ed.participants.find(ep=>ep.participantId===p.id);
        if(existing){ existing.pagado = r.paid; }
        else { ed.participants.push({participantId:p.id, pagado:r.paid, cuota: suggestedCuota(p.id, ed), note:""}); }
      });
      saveState(); render();
    }
  });
}

function ligaGridHTML(ed){
  if(!ed.jornadas.length) return `<div class="card"><p class="muted" style="margin:0">Todavía no hay jornadas en esta edición.</p></div>`;
  if(!ed.participants.length) return `<div class="card"><p class="muted" style="margin:0">Todavía no hay jugadores en esta edición.</p></div>`;
  const rowsHTML = ed.participants.map(ep=>{
    const p = getParticipant(ep.participantId);
    if(!p) return "";
    let eliminatedAt = -1;
    const cells = ed.jornadas.map((j, idx)=>{
      if(eliminatedAt>=0 && idx>eliminatedAt) return `<td class="gcell off">—</td>`;
      const wasExpelledHere = (j.expelled||[]).includes(ep.participantId);
      if(wasExpelledHere){ eliminatedAt=idx; return `<td class="gcell g-elim">No pronosticó</td>`; }
      const pick = j.picks.find(pk=>pk.participantId===ep.participantId);
      if(!pick) return `<td class="gcell off">—</td>`;
      const r = pickOutcome(pick);
      if(r.outcome==="eliminado") eliminatedAt=idx;
      const cls = r.outcome==="sobrevive"?"g-ok":r.outcome==="eliminado"?"g-elim":r.outcome==="anulada"?"g-warn":"g-pending";
      const text = pick.team2? `${esc(pick.team1)} / ${esc(pick.team2)}` : (pick.team1? esc(pick.team1) : "—");
      return `<td class="gcell ${cls}">${text}</td>`;
    }).join("");
    return `<tr><td class="gname">${esc(p.name)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="tblwrap"><table class="picktable gridtable">
    <thead><tr><th class="gname">Jugador</th>${ed.jornadas.map(j=>`<th>${esc(j.label)}</th>`).join("")}</tr></thead>
    <tbody>${rowsHTML}</tbody>
  </table></div>`;
}

/* --- parser de texto pegado de WhatsApp --- */
/* Busca, al principio de la línea, el nombre MÁS LARGO de un jugador ya existente en la
   edición. Así no hace falta ningún separador (":", "-"...): "Sergio Acevedo Barça / Madrid"
   se reconoce igual que "Sergio Acevedo: Barça / Madrid". Si ningún jugador conocido encaja
   al principio, se cae a los separadores clásicos como respaldo. */
function splitNameAndRest(line, candidates){
  const norm = normName(line);
  let best = null, bestLen = 0;
  candidates.forEach(p=>{
    const pn = normName(p.name);
    if(pn && norm.startsWith(pn) && pn.length>bestLen){
      best = p; bestLen = pn.length;
    }
  });
  if(best){
    const wordCount = best.name.trim().split(/\s+/).length;
    const words = line.split(/\s+/);
    return { name: words.slice(0, wordCount).join(" "), rest: words.slice(wordCount).join(" ").trim() };
  }
  if(line.includes(":")){
    const i = line.indexOf(":");
    return { name: line.slice(0,i).trim(), rest: line.slice(i+1).trim() };
  }
  const m = line.match(/^(.+?)\s+-\s+(.+)$/);
  if(m) return { name: m[1].trim(), rest: m[2].trim() };
  return { name: "", rest: line };
}
function parseWhatsapp(text, ed){
  const candidates = ed ? ed.participants.map(ep=>getParticipant(ep.participantId)).filter(Boolean) : [];
  const lines = text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const byName = new Map();
  lines.forEach(raw=>{
    let line = raw.replace(/^[-•*\d.)\s]+(?=\S)/,"").trim();
    const { name, rest } = splitNameAndRest(line, candidates);
    const teams = rest.split(/\s*(?:\/|\||,| y | vs\.?| contra )\s*/i).filter(Boolean);
    byName.set(name || `(sin nombre) ${byName.size+1}`, {name, team1: teams[0]||"", team2: teams[1]||"", raw});
  });
  return Array.from(byName.values());
}

/* Empareja el nombre pegado con un jugador YA existente en la edición (nunca crea jugadores nuevos).
   Prueba, en orden: coincidencia exacta, prefijo sin ambigüedad, y solapamiento de palabras. */
function bestMatchParticipant(ed, rawName){
  const n = normName(rawName);
  if(!n) return null;
  const candidates = ed.participants.map(ep=>getParticipant(ep.participantId)).filter(Boolean);
  const exact = candidates.find(p=>normName(p.name)===n);
  if(exact) return exact.id;
  const prefix = candidates.filter(p=>{
    const pn = normName(p.name);
    return pn.startsWith(n) || n.startsWith(pn);
  });
  if(prefix.length===1) return prefix[0].id;
  const inputTokens = n.split(/\s+/).filter(Boolean);
  let best=null, bestScore=0, secondScore=0;
  candidates.forEach(p=>{
    const pTokens = normName(p.name).split(/\s+/).filter(Boolean);
    let score=0;
    inputTokens.forEach(it=>{
      if(pTokens.some(pt=>pt===it || pt.startsWith(it) || it.startsWith(pt))) score++;
    });
    if(score>bestScore){ secondScore=bestScore; best=p; bestScore=score; }
    else if(score>secondScore){ secondScore=score; }
  });
  return (best && bestScore>0 && bestScore>secondScore) ? best.id : null;
}

          ${ed.participants.filter(ep=>derived[ep.participantId].status==="activo").map(ep=>{

          }).join("")}

    ` : isOpen? `<p class="muted" style="margin-top:12px">Solo el administrador puede cerrar esta edición y definir el ganador.</p>` : ""}

function wireEdition(ed){
  const card = document.querySelector(`[data-ed="${ed.id}"]`);
  if(!card) return;
  card.addEventListener("click", e=>{
    const act = e.target.dataset.act;
    if(act==="closeWithWinner"){
      const sel = document.getElementById(`winnerSelect-${ed.id}`);
      const pid = sel.value;
      if(!pid){ alert("Elige un ganador primero."); return; }
      ed.status="cerrada_ganador"; ed.winnerId=pid;
      saveState(); render();
    }
    if(act==="closeNoWinner"){
      if(!confirm("¿Cerrar esta edición sin ganador? El bote pasará íntegro a una nueva edición y todos deberán volver a pagar para seguir participando.")) return;
      const money = computeMoney(ed);
      ed.status="cerrada_sin_ganador";
      const next = newEdition(ed.number+1, ed.season, money.boteTotal);
      state.editions.push(next);
      next.participants = ed.participants.map(ep=>({
        participantId: ep.participantId, pagado:false, cuota: suggestedCuota(ep.participantId, next), note:""
      }));
      saveState(); render();
    }
    if(act==="removeEdition"){
      const totalPicks = ed.jornadas.reduce((n,j)=>n+j.picks.length,0);
      const detail = [
        ed.jornadas.length? `${ed.jornadas.length} jornada(s) con ${totalPicks} pronóstico(s)` : null,
        ed.participants.length? `${ed.participants.length} jugador(es) inscritos y sus pagos` : null,
      ].filter(Boolean).join(" y ");
      const withDetail = detail? ` Se perderán ${detail}.` : "";
      if(!confirm(`¿Eliminar la Edición ${ed.number} por completo?${withDetail} Esta acción no se puede deshacer.`)) return;
      if(!confirm(`Confirmación final: esto borrará la Edición ${ed.number} para todos en cuanto se publique. ¿Continuar?`)) return;
      state.editions = state.editions.filter(x=>x.id!==ed.id);
      saveState(); render();
    }
  });
}

function fmtDate(ts){
  if(!ts) return "";
  return new Date(ts).toLocaleString("es-ES",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}

function parseMatchLine(line){
  let m = line.match(/^(.*\S)\s+(\d{1,2})\s*[-–]\s*(\d{1,2})\s+(\S.*)$/);
  if(m) return {team1:m[1].trim(), team2:m[4].trim(), extra:`${m[2]}-${m[3]}`, raw:line};
  m = line.match(/^(.*?)\s+(?:-|–|vs\.?|contra)\s+(.+)$/i);
  if(m) return {team1:m[1].trim(), team2:m[2].trim(), extra:"", raw:line};
  return {team1:line.trim(), team2:"", extra:"", raw:line};
}
function parseMatchBlock(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(parseMatchLine);

/* ============================== RENDER: CLASIFICACIÓN ============================== */
function parseStandingsLine(line, fallbackPos){
  const tokens = line.trim().split(/\s+/).filter(Boolean);
  if(tokens.length>=9){
    const stats = tokens.slice(-8);
    const statsNum = stats.map(s=>parseInt(s.replace(/^\+/,""),10));
    if(!statsNum.some(n=>Number.isNaN(n))){
      let rest = tokens.slice(0, tokens.length-8);
      let pos = fallbackPos;
      if(rest.length>1 && /^\d+$/.test(rest[0])){ pos = parseInt(rest[0],10); rest = rest.slice(1); }
      const name = rest.join(" ");
      if(name){
        const [pj,g,e,p,gf,gc,dg,pts] = statsNum;
        return {pos, name, pj,g,e,p,gf,gc,dg,pts};
      }
    }
  }
  return {pos:fallbackPos, name:line.trim(), pj:0,g:0,e:0,p:0,gf:0,gc:0,dg:0,pts:0};
}
function parseStandings(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map((line,i)=>parseStandingsLine(line, i+1));
}

    <tbody>
      ${rows.map((r,i)=>{
        const zone = i<4? "zone-top": i>=rows.length-3? "zone-bottom": "";
        return `<tr class="${zone}"><td>${r.pos}</td><td style="font-weight:700;color:#fff">${esc(r.name)}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.dg>0?'+':''}${r.dg}</td><td style="font-weight:800;color:var(--teal)">${r.pts}</td></tr>`;
      }).join("")}
    </tbody>
  </table></div>`;
}
function renderClasificacion(){
  const el = document.getElementById("panel-clasificacion");
  const clas = state.liga.clasificacion;
  const admin = isAdmin();
  let html = `<div class="section-h"><span class="mk">○</span><span class="tag">Clasificación LaLiga</span><span class="line"></span></div>`;
  html += `<div class="card">`;
  if(clas && clas.rows.length){
    html += `<div style="margin-bottom:12px"><span class="muted" style="font-size:11.5px">Actualizado ${fmtDate(clas.updatedAt)}</span></div>`;
    html += standingsTableHTML(clas.rows);
  } else {
    html += `<p class="muted" style="margin:0 0 10px">Todavía no has añadido la clasificación.</p>`;
  }
  if(admin){
    html += `<div class="btnrow" style="margin-top:14px"><button class="btn sm" id="editClasifBtn">${clas?'Actualizar clasificación':'+ Añadir clasificación'}</button></div>`;
  } else {
    html += `<p class="muted" style="margin-top:14px">Solo el administrador puede añadir o actualizar la clasificación.</p>`;
  }
  html += `<div id="clasifForm" class="hidden" style="margin-top:12px"></div>`;
  html += `</div>`;
  el.innerHTML = html;

  if(!admin) return;
  document.getElementById("editClasifBtn").addEventListener("click", ()=>{
    const box = document.getElementById("clasifForm");
    box.classList.toggle("hidden");
    if(box.classList.contains("hidden")) return;
    box.innerHTML = pasteFormHTML({
      showLabel:false, textId:"clasifText", analizarId:"clasifAnalizar", previewId:"clasifPreview",
      textLabel:"Pegar la tabla de clasificación (una fila por equipo)",
      defaultText: clas? clas.rows.map(r=>`${r.pos} ${r.name} ${r.pj} ${r.g} ${r.e} ${r.p} ${r.gf} ${r.gc} ${r.dg>=0?'+':''}${r.dg} ${r.pts}`).join("\n") : "",
      placeholder:"1 Real Madrid 38 28 7 3 88 40 +48 91"
    });
    document.getElementById("clasifAnalizar").addEventListener("click", ()=>{
      const rows = parseStandings(document.getElementById("clasifText").value);
      document.getElementById("clasifPreview").innerHTML = standingsPreviewHTML(rows);
      wireStandingsPreview(rows2=>{
        state.liga.clasificacion = {updatedAt:Date.now(), rows:rows2};
        saveState(); render();
      });
    });
  });
}

/* ============================== RENDER: REGLAS ============================== */
function renderReglas(){

    <div class="card rules">

      <p>Se pagan <b>10 €</b> para participar.</p>
      <p>Es imprescindible haber pagado antes del comienzo de la jornada inicial. A pesar de estar inscrito en la lista, si no se han abonado los 10 €, se queda expulsado de esa edición.</p>

      <h3>Reparto del bote</h3>
      <p>El <b>90%</b> del dinero acumulado va destinado al ganador del juego o a un posible bote acumulado. El <b>10%</b> restante es para la organización, en concepto de gestión.</p>

      <h3>Un único ganador</h3>
      <p>Solo puede haber un único ganador. Si no lo hay, el bote se acumula para la siguiente edición, y todos deben volver a aportar 10 € para seguir participando. Quien no abone los 10 € pierde el derecho a optar al bote.</p>
      <p>Los nuevos participantes que se sumen tendrán que pagar tantas jornadas (ediciones) como lleve acumulándose el bote para poder participar. En estos casos, el bote anterior va íntegro para el ganador.</p>

      <h3>Cómo se juega</h3>
      <p>Cada jornada, el participante elige dos equipos: <b>Equipo 1</b>, con el que juega, y <b>Equipo 2</b>, de reserva por si el partido del Equipo 1 se anula o se pospone. Ambos equipos deben pertenecer a partidos distintos.</p>
      <p>Ejemplo: si eliges Barcelona / Real Madrid, tu equipo es el Barcelona esa jornada — pero si el partido se suspende antes de empezar o incluso en el minuto 89 (sin importar el resultado en ese momento), tu equipo pasa a ser el Real Madrid para esa misma jornada.</p>
      <p>Si un jugador elige dos equipos y ambos partidos quedan anulados, se anula la jornada completa <b>para ese jugador</b>.</p>

      <h3>Plazos y cambios</h3>
      <p>Si el jugador no envía su pronóstico antes de la hora marcada por el administrador, queda expulsado y pierde el derecho a seguir participando.</p>
      <p>Una vez enviado el pronóstico, se puede cambiar mientras siga dentro de plazo, publicando el nuevo equipo <b>sin editar</b> el mensaje anterior. Cualquier mensaje con los equipos editados queda invalidado.</p>

      <h3>Continuidad entre temporadas</h3>
      <p>Si una edición no termina en la temporada actual, continúa desde la jornada 1 de la siguiente temporada, respetando la norma de no repetir equipos — independientemente de los equipos descendidos.</p>

/* ============================== RENDER MASTER ============================== */
function render(){
  document.querySelectorAll(".tabbtn").forEach(b=>b.classList.toggle("active", b.dataset.tab===activeTab));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.id===`panel-${activeTab}`));
  renderHeader();
  renderSyncBanner();
  if(activeTab==="resumen") renderResumen();
  if(activeTab==="jugadores") renderJugadores();
  if(activeTab==="jornadas") renderJornadas();
  if(activeTab==="ediciones") renderEdiciones();
  if(activeTab==="liga") renderLiga();
  if(activeTab==="clasificacion") renderClasificacion();
  if(activeTab==="reglas") renderReglas();
}

/* ============================== EXPORT / IMPORT ============================== */
document.getElementById("exportBtn").addEventListener("click", e=>{
  e.preventDefault();
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `calamar-26-27-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
});
document.getElementById("importBtn").addEventListener("click", e=>{
  e.preventDefault();
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.participants || !data.editions) throw new Error("formato inválido");
      if(!data.liga) data.liga = {resultados:null, proximas:[], clasificacion:null};
      state = data; saveState(); activePlayerId=null; render();
      alert("Copia importada correctamente.");
    }catch(err){ alert("No se pudo importar el archivo: "+err.message); }
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ============================== PANEL DE ADMINISTRADOR ============================== */
function renderAdminPanel(){
  const panel = document.getElementById("adminPanel");
  if(githubToken){
    panel.innerHTML = `
      <p><b>Modo administrador activo.</b> Cada cambio que hagas (jugadores, pagos, jornadas, ediciones) se publica solo en GitHub para que todo el mundo lo vea.</p>
      <div class="btnrow">
        <button class="btn sm primary" id="publishNowBtn">Publicar ahora</button>
        <button class="btn sm danger" id="adminLogoutBtn">Cerrar sesión de administrador</button>
      </div>`;
    document.getElementById("publishNowBtn").addEventListener("click", ()=> publishGame());
    document.getElementById("adminLogoutBtn").addEventListener("click", ()=>{
      githubToken = "";
      localStorage.removeItem(GH_TOKEN_KEY);
      syncStatus = { state:"read", message:"" };
      document.getElementById("adminPanel").classList.add("hidden");
      renderSyncBanner();
    });
  } else {
    panel.innerHTML = `
      <p>Pega aquí un <b>token de acceso personal de GitHub</b> (fine-grained), con acceso limitado solo al repositorio <b>${GH_OWNER}/${GH_REPO}</b> y permiso <b>Contents: Read and write</b>. Se guarda únicamente en este navegador, nunca se comparte.</p>
      <p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Crear token en GitHub →</a></p>
      <div class="field"><label>Token</label><input type="password" id="tokenInput" placeholder="github_pat_…" autocomplete="off"></div>
      <div class="btnrow"><button class="btn sm primary" id="activateAdminBtn">Activar</button></div>
      <p id="tokenError" class="muted" style="color:var(--pink);margin:10px 0 0"></p>`;
    document.getElementById("activateAdminBtn").addEventListener("click", async ()=>{
      const val = document.getElementById("tokenInput").value.trim();
      if(!val) return;
      const errEl = document.getElementById("tokenError");
      errEl.textContent = "Comprobando…";
      try{
        const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`, {
          headers: { "Authorization": `Bearer ${val}`, "Accept": "application/vnd.github+json" }
        });
        if(!res.ok) throw new Error("Token inválido o sin acceso a este repositorio.");
        githubToken = val;
        localStorage.setItem(GH_TOKEN_KEY, val);
        syncStatus = { state:"synced", message:"" };
        renderAdminPanel();
        renderSyncBanner();
        publishGame();
      }catch(e){
        errEl.textContent = e.message;
      }
    });
  }
}
document.getElementById("adminModeBtn").addEventListener("click", e=>{
  e.preventDefault();
  const panel = document.getElementById("adminPanel");
  panel.classList.toggle("hidden");
  if(!panel.classList.contains("hidden")) renderAdminPanel();
});

render();
loadGameFeed();
