name: Actualizar datos de LaLiga

on:
  schedule:
    # 2 veces al día, a las 00:05 y a las 12:05 UTC.
    - cron: "5 0,12 * * *"
  workflow_dispatch: {}    # permite lanzarlo a mano desde Actions o con `gh workflow run`

permissions:
  contents: write

concurrency:
  group: update-liga
  cancel-in-progress: false   # si una ejecución tarda, la siguiente espera en vez de solaparse

jobs:
  update-liga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descargar datos de LaLiga
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/update-liga.mjs

      - name: Publicar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/liga.json; then
            echo "Sin cambios en data/liga.json"
          else
            git add data/liga.json
            git commit -m "Actualizar datos de LaLiga"
            git pull --rebase origin main
            git push
          fi
